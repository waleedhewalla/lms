name: release

# Tag vX.Y.Z → build and publish the API and web images to GHCR, tagged with the version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: edunexus-api, context: backend }
          - { name: edunexus-web, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/$owner/${{ matrix.name }}
          docker build -t $image:$version -t $image:latest ${{ matrix.context }}
          docker push $image:$version
          docker push $image:latest
  notes:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release create "$GITHUB_REF_NAME" --title "EduNexus $GITHUB_REF_NAME" --notes-file docs/10-roadmap/RELEASE-NOTES.md --verify-tag
