name: ci

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [develop, main]

env:
  DOTNET_VERSION: 9.0.x
  NODE_VERSION: 20

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python infra/ci/check-traceability.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edunexus_test
          POSTGRES_USER: edunexus
          POSTGRES_PASSWORD: edunexus
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U edunexus -d edunexus_test"
          --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5673:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-retries 10
      # The shared rate-limit store tests (RateLimitStoreTests) count in a real Redis on 6381.
      redis:
        image: redis:7
        ports: ['6381:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
      # AI tests (Ai_AskEcho_LogsInteraction) index and search via OpenSearch on 9201.
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9201:9200']
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet build backend/EduNexus.sln --nologo -v minimal
      - run: dotnet test backend/EduNexus.sln --no-build --nologo -v minimal
        env:
          EDUNEXUS_TEST_REDIS: localhost:6381
      - name: No vulnerable NuGet packages (incl. transitive)
        run: |
          dotnet list backend/EduNexus.sln package --vulnerable --include-transitive | tee /tmp/vuln.txt
          ! grep -q 'has the following vulnerable packages' /tmp/vuln.txt
        env:
          EDUNEXUS_CONNECTION: Host=localhost;Port=5433;Database=edunexus_test;Username=edunexus;Password=edunexus

  # The real clients against real servers that speak TLS with a private CA (Postgres, Redis): the handshake must succeed
  # with the site CA, fail with any other CA, and plaintext must be refused. RabbitMQ, MinIO and OpenSearch use the same
  # trust code, covered by PrivateCaTests (a real TLS listener) and the chart render checks above.
  tls-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Private CA and TLS-only Postgres and Redis
        run: |
          d="$RUNNER_TEMP/tls"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj "/CN=edunexus-ci-ca"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > ext.cnf
          for n in pg redis; do
            openssl req -newkey rsa:2048 -nodes -keyout $n.key -out $n.csr -subj "/CN=localhost"
            openssl x509 -req -in $n.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out $n.crt -days 2 -extfile ext.cnf
          done
          printf 'local all all trust\nhostssl all all all trust\n' > pg_hba.conf
          chmod 644 *.crt pg_hba.conf redis.key
          sudo chown 999:999 pg.key pg.crt pg_hba.conf && sudo chmod 600 pg.key
          docker run -d --name pgtls -e POSTGRES_HOST_AUTH_METHOD=trust -p 5434:5432 -v "$d:/tls:ro" postgres:16 \
            postgres -c ssl=on -c ssl_cert_file=/tls/pg.crt -c ssl_key_file=/tls/pg.key -c hba_file=/tls/pg_hba.conf
          docker run -d --name redistls -p 6391:6379 -v "$d:/tls:ro" redis:7 \
            redis-server --port 0 --tls-port 6379 --tls-cert-file /tls/redis.crt --tls-key-file /tls/redis.key \
            --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no
          for i in $(seq 1 30); do
            docker exec pgtls pg_isready -U postgres >/dev/null 2>&1 && docker exec redistls redis-cli --tls --cacert /tls/ca.crt ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          echo "TLS_DIR=$d" >> "$GITHUB_ENV"
      - run: dotnet build backend/EduNexus.sln --nologo -v minimal
      - name: TLS tests (a skipped or unconfigured test fails here)
        run: dotnet test backend/EduNexus.sln --no-build --nologo -v minimal --filter "Category=Tls"
        env:
          EDUNEXUS_REQUIRE_TLS_TESTS: 'true'
          EDUNEXUS_TEST_TLS_CA: ${{ env.TLS_DIR }}/ca.crt
          EDUNEXUS_TEST_TLS_PG: Host=127.0.0.1;Port=5434;Username=postgres;Database=postgres
          EDUNEXUS_TEST_TLS_REDIS: 127.0.0.1:6391
      - name: Servers log
        if: failure()
        run: docker logs pgtls; docker logs redistls

  ef-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet tool install --global dotnet-ef --version 9.0.9
      - run: >
          dotnet-ef migrations script --idempotent
          --project backend/src/EduNexus.Infrastructure/EduNexus.Infrastructure.csproj
          --startup-project backend/src/EduNexus.Api/EduNexus.Api.csproj
          --output /tmp/edunexus-migration.sql
      - run: test -s /tmp/edunexus-migration.sql && grep -c 'tenant_isolation' /tmp/edunexus-migration.sql

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: No high/critical npm advisories
        run: npm audit --audit-level=high

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint + render (defaults and ingress on)
        run: |
          helm lint infra/helm/edunexus
          helm template edunexus infra/helm/edunexus > /tmp/default.yaml
          helm template edunexus infra/helm/edunexus --set ingress.enabled=true > /tmp/ingress.yaml
          grep -q 'name: edunexus-web' /tmp/default.yaml
          grep -q 'kind: Ingress' /tmp/ingress.yaml
          ! grep -q 'CHANGEME' /tmp/default.yaml
          grep -q 'RateLimiting__PermitsPerMinute' /tmp/default.yaml
          grep -q 'ForwardedHeaders__KnownNetworks__3' /tmp/default.yaml
          grep -q 'RateLimiting__Redis__ConnectionString' /tmp/default.yaml
          helm template edunexus infra/helm/edunexus --set api.rateLimiting.redis="" > /tmp/no-redis-limit.yaml
          ! grep -q 'RateLimiting__Redis__ConnectionString' /tmp/no-redis-limit.yaml
      - name: In-cluster TLS renders with no plaintext path (cert-manager mode, supplied-Secrets mode, default unchanged)
        run: |
          pip install pyyaml
          helm template edunexus infra/helm/edunexus --set tls.enabled=true > /tmp/tls-cm.yaml
          python infra/ci/check-tls-render.py /tmp/tls-cm.yaml certManager
          grep -q 'kind: Certificate' /tmp/tls-cm.yaml
          helm template edunexus infra/helm/edunexus --set tls.enabled=true --set tls.mode=existingSecret > /tmp/tls-existing.yaml
          python infra/ci/check-tls-render.py /tmp/tls-existing.yaml existingSecret
          helm template edunexus infra/helm/edunexus --set tls.enabled=true --set 'tls.issuerRef.name=corp-ca' --set 'tls.issuerRef.kind=ClusterIssuer' > /tmp/tls-issuer.yaml
          grep -q 'name: corp-ca' /tmp/tls-issuer.yaml
          ! grep -q 'name: edunexus-selfsigned' /tmp/tls-issuer.yaml
          ! helm template edunexus infra/helm/edunexus --set tls.enabled=true --set tls.mode=bogus > /dev/null 2>&1
          # Off by default: nothing about TLS leaks into a normal install.
          ! grep -Eq 'edunexus-tls-|Tls__CaFile|RabbitMQ__Tls|kind: Certificate|ssl=on' /tmp/default.yaml
          grep -q 'RabbitMQ__Port, value: "5672"' /tmp/default.yaml
          # Connectors (LMS/SIS course catalogue): off by default; on, it needs the sealing key from the api Secret.
          ! grep -q 'Connectors__' /tmp/default.yaml
          helm template edunexus infra/helm/edunexus --set api.connectors.enabled=true > /tmp/connectors.yaml
          grep -q 'Connectors__Enabled' /tmp/connectors.yaml
          grep -A3 'Connectors__SecretKey' /tmp/connectors.yaml | grep -q 'key: connectors-key'
          helm template edunexus infra/helm/edunexus --set networkPolicy.enabled=true > /tmp/netpol.yaml
          test "$(grep -c 'kind: NetworkPolicy' /tmp/netpol.yaml)" = 5
          ! grep -q 'kind: NetworkPolicy' /tmp/default.yaml
      - name: Keycloak realm import issues the claims the API expects
        run: |
          docker run -d --name kc -p 8081:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/infra/keycloak/realm-edunexus.json:/opt/keycloak/data/import/realm-edunexus.json:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8081/realms/edunexus/.well-known/openid-configuration && break; sleep 2; done
          bash infra/keycloak/verify-realm.sh http://127.0.0.1:8081 admin admin
      - name: Compose config (infra + app tier)
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml config -q
      - name: Build API image
        run: docker build -t edunexus-api:ci backend
      - name: Build web image
        run: docker build -t edunexus-web:ci frontend
      - name: Smoke web image (runtime config is read from the environment)
        run: |
          docker run -d --name web -p 8000:8000 -e EDUNEXUS_API_BASE=https://api.example.test -e EDUNEXUS_OIDC_AUTHORITY=https://idp.example.test/realms/x edunexus-web:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/runtime-config.js && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/runtime-config.js | grep -q 'https://api.example.test'
          curl -sf http://127.0.0.1:8000/my-work | grep -q 'runtime-config.js'
          docker exec web id -u | grep -qx 1001
          curl -sI http://127.0.0.1:8000/my-work | grep -i '^content-security-policy:.*https://api.example.test'
      - name: Smoke API image (Production refuses dev auth)
        run: |
          docker run --rm -e ASPNETCORE_ENVIRONMENT=Production edunexus-api:ci > /tmp/api.log 2>&1 && exit 1 || true
          grep -q 'Production requires Auth:Authority' /tmp/api.log
