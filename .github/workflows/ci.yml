name: ci

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [develop, main]

env:
  DOTNET_VERSION: 9.0.x
  NODE_VERSION: 20

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python infra/ci/check-traceability.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edunexus_test
          POSTGRES_USER: edunexus
          POSTGRES_PASSWORD: edunexus
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U edunexus -d edunexus_test"
          --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5673:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-retries 10
      # AI tests (Ai_AskEcho_LogsInteraction) index and search via OpenSearch on 9201.
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9201:9200']
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet build backend/EduNexus.sln --nologo -v minimal
      - run: dotnet test backend/EduNexus.sln --no-build --nologo -v minimal
        env:
          EDUNEXUS_CONNECTION: Host=localhost;Port=5433;Database=edunexus_test;Username=edunexus;Password=edunexus

  ef-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet tool install --global dotnet-ef --version 9.0.9
      - run: >
          dotnet-ef migrations script --idempotent
          --project backend/src/EduNexus.Infrastructure/EduNexus.Infrastructure.csproj
          --startup-project backend/src/EduNexus.Api/EduNexus.Api.csproj
          --output /tmp/edunexus-migration.sql
      - run: test -s /tmp/edunexus-migration.sql && grep -c 'tenant_isolation' /tmp/edunexus-migration.sql

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
