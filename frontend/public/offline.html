<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduNexus — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e6edf7; font: 16px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 28rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: .4rem 0; color: #b4c0d4; }
  button { margin-top: 1.2rem; padding: .6rem 1.2rem; border: 0; border-radius: .5rem; background: #38bdf8; color: #06202e; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline<br><span dir="rtl" lang="ar">أنت غير متصل بالإنترنت</span></h1>
  <p>EduNexus needs a connection to show your work. Nothing has been lost: reconnect and try again.</p>
  <p dir="rtl" lang="ar">يحتاج EduNexus إلى اتصال لعرض أعمالك. لم يُفقد شيء: أعد الاتصال وحاول مرة أخرى.</p>
  <button type="button" onclick="location.reload()">Try again · إعادة المحاولة</button>
</main>
</body>
</html>
