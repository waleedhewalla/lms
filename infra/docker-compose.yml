services:
  postgres:
    image: postgres:16
    container_name: edunexus-postgres
    restart: unless-stopped
    command: postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=60 -c archive_command='test ! -f /walarchive/%f && cp %p /walarchive/%f'
    environment:
      POSTGRES_DB: edunexus
      POSTGRES_USER: edunexus
      POSTGRES_PASSWORD: edunexus
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, walarchive:/walarchive, pgbackup:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edunexus"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: edunexus-redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
  rabbitmq:
    image: rabbitmq:3-management
    container_name: edunexus-rabbitmq
    restart: unless-stopped
    ports: ["5673:5672", "15673:15672"]
  minio:
    image: minio/minio
    container_name: edunexus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9002:9000", "9003:9001"]
    volumes: [miniodata:/data]
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: edunexus-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9201:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: edunexus-prometheus
    restart: unless-stopped
    ports: ["9091:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:11.4.0
    container_name: edunexus-grafana
    restart: unless-stopped
    ports: ["3021:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: edunexus
    volumes: [grafanadata:/var/lib/grafana, ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/edunexus.yml:ro, ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/edunexus.yml:ro, ./grafana/dashboard-api.json:/etc/grafana/dashboards/api.json:ro]
  tempo:
    image: grafana/tempo:2.7.0
    container_name: edunexus-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports: ["4317:4317", "4318:4318", "3200:3200"]
  # Local OIDC IdP for integration proofs. Opt-in: compose --profile idp up keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: edunexus-keycloak
    profiles: [idp]
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: [keycloakdata:/opt/keycloak/data]
volumes:
  pgdata: {}
  miniodata: {}
  osdata: {}
  grafanadata: {}
  walarchive: {}
  pgbackup: {}
  redisdata: {}
  keycloakdata: {}
