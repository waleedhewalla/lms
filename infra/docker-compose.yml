services:
  postgres:
    image: postgres:16
    container_name: edunexus-postgres
    command: postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=60 -c archive_command='test ! -f /walarchive/%f && cp %p /walarchive/%f'
    environment:
      POSTGRES_DB: edunexus
      POSTGRES_USER: edunexus
      POSTGRES_PASSWORD: edunexus
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, walarchive:/walarchive, pgbackup:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edunexus"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: edunexus-redis
    ports: ["6380:6379"]
  rabbitmq:
    image: rabbitmq:3-management
    container_name: edunexus-rabbitmq
    ports: ["5673:5672", "15673:15672"]
  minio:
    image: minio/minio
    container_name: edunexus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9002:9000", "9003:9001"]
    volumes: [miniodata:/data]
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: edunexus-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9201:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: edunexus-prometheus
    ports: ["9091:9090"]
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:11.4.0
    container_name: edunexus-grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: edunexus
    volumes: [grafanadata:/var/lib/grafana]
volumes:
  pgdata: {}
  miniodata: {}
  osdata: {}
  grafanadata: {}
  walarchive: {}
  pgbackup: {}
