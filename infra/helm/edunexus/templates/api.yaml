{{- if .Values.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edunexus-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: edunexus-api }
  template:
    metadata:
      labels: { app: edunexus-api }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: "{{ .Values.registry }}{{ .Values.api.image }}"
          ports: [{ containerPort: {{ .Values.api.port }} }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: {{ .Values.api.env.ASPNETCORE_ENVIRONMENT | quote }} }
            - name: EDUNEXUS_CONNECTION
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: connection } }
            - { name: Auth__Authority, value: {{ .Values.api.auth.authority | quote }} }
            - { name: Auth__Audience, value: {{ .Values.api.auth.audience | quote }} }
            - { name: Auth__EnableDevToken, value: "false" }
            - { name: RabbitMQ__Host, value: {{ .Values.api.rabbitmq.host | quote }} }
            {{- if .Values.tls.enabled }}
            - { name: Tls__CaFile, value: /etc/edunexus/tls/ca.crt }
            - { name: RabbitMQ__Port, value: "5671" }
            - { name: RabbitMQ__Tls, value: "true" }
            - { name: Storage__Secure, value: "true" }
            {{- else }}
            - { name: RabbitMQ__Port, value: {{ .Values.api.rabbitmq.port | quote }} }
            {{- end }}
            - { name: Storage__Endpoint, value: {{ .Values.api.storage.endpoint | quote }} }
            - { name: Storage__AccessKey, value: minio }
            - name: Storage__SecretKey
              valueFrom: { secretKeyRef: { name: edunexus-minio, key: root-password } }
            - { name: Cors__AllowedOrigins, value: {{ .Values.web.publicUrl | quote }} }
            - { name: RateLimiting__PermitsPerMinute, value: {{ .Values.api.rateLimiting.permitsPerMinute | quote }} }
            - { name: RateLimiting__ExpensivePermitsPerMinute, value: {{ .Values.api.rateLimiting.expensivePermitsPerMinute | quote }} }
            {{- if .Values.api.rateLimiting.redis }}
            - { name: RateLimiting__Redis__ConnectionString, value: {{ if .Values.tls.enabled }}{{ printf "%s,ssl=true" .Values.api.rateLimiting.redis | quote }}{{ else }}{{ .Values.api.rateLimiting.redis | quote }}{{ end }} }
            {{- end }}
            {{- range $i, $cidr := splitList "," .Values.api.trustedProxyNetworks }}
            - { name: ForwardedHeaders__KnownNetworks__{{ $i }}, value: {{ trim $cidr | quote }} }
            {{- end }}
            {{- if .Values.api.connectors.enabled }}
            - { name: Connectors__Enabled, value: "true" }
            - name: Connectors__SecretKey
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: connectors-key } }
            {{- end }}
            - { name: AI__Provider, value: {{ .Values.api.ai.provider | quote }} }
            - { name: AI__BaseUrl, value: {{ .Values.api.ai.baseUrl | quote }} }
            - { name: AI__Model, value: {{ .Values.api.ai.model | quote }} }
            - name: AI__ApiKey
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: ai-api-key, optional: true } }
            - { name: AI__OpenSearchUrl, value: {{ if .Values.tls.enabled }}{{ .Values.api.ai.openSearchUrl | replace "http://" "https://" | quote }}{{ else }}{{ .Values.api.ai.openSearchUrl | quote }}{{ end }} }
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - { name: tls-ca, mountPath: /etc/edunexus/tls, readOnly: true }
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls-ca
          # Only the CA certificate (the public half) is mounted, never a key.
          secret:
            secretName: edunexus-tls-api
            items: [{ key: ca.crt, path: ca.crt }]
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: edunexus-api
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: edunexus-api }
  ports: [{ port: 80, targetPort: {{ .Values.api.port }} }]
