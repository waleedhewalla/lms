# Stateful reference services. Production sites: size storage, set resource limits,
# wire backups (postgres) per infra/postgres/RUNBOOK.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edunexus-postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: edunexus-postgres
  replicas: 1
  selector:
    matchLabels: { app: edunexus-postgres }
  template:
    metadata:
      labels: { app: edunexus-postgres }
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.registry }}{{ .Values.postgres.image }}"
          args:
            - postgres
            - -cwal_level=replica
            - -carchive_mode=on
            - -carchive_timeout=60
            - -carchive_command=test ! -f /walarchive/%f && cp %p /walarchive/%f
            {{- if .Values.tls.enabled }}
            - -cssl=on
            - -cssl_cert_file=/tls/tls.crt
            - -cssl_key_file=/tls/tls.key
            - -chba_file=/etc/edunexus-hba/pg_hba.conf
            {{- end }}
          env:
            - { name: POSTGRES_DB, value: edunexus }
            - { name: POSTGRES_USER, value: edunexus }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: edunexus-postgres, key: password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: walarchive, mountPath: /walarchive }
            - { name: backups, mountPath: /backups }
            {{- if .Values.tls.enabled }}
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: hba, mountPath: /etc/edunexus-hba, readOnly: true }
            {{- end }}
      {{- if .Values.tls.enabled }}
      # 999 is the postgres user's group in the image: Postgres insists the key is not readable by anyone else.
      securityContext: { fsGroup: 999 }
      volumes:
        - name: tls
          secret: { secretName: edunexus-tls-postgres, defaultMode: 0440 }
        - name: hba
          configMap: { name: edunexus-postgres-hba }
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgres.storage }} } } }
    - metadata: { name: walarchive }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgres.walArchiveSize }} } } }
    - metadata: { name: backups }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgres.backupSize }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: edunexus-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: edunexus-postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edunexus-redis
  namespace: {{ .Values.namespace }}
spec:
  serviceName: edunexus-redis
  replicas: 1
  selector:
    matchLabels: { app: edunexus-redis }
  template:
    metadata:
      labels: { app: edunexus-redis }
    spec:
      containers:
        - name: redis
          image: "{{ .Values.registry }}{{ .Values.redis.image }}"
          {{- if .Values.tls.enabled }}
          # TLS only: the plaintext port is off. Clients are checked by name and CA; they present no certificate.
          args: [redis-server, --appendonly, "yes", --port, "0", --tls-port, "6379",
                 --tls-cert-file, /tls/tls.crt, --tls-key-file, /tls/tls.key, --tls-ca-cert-file, /tls/ca.crt, --tls-auth-clients, "no"]
          {{- else }}
          args: [redis-server, --appendonly, "yes"]
          {{- end }}
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.tls.enabled }}
            - { name: tls, mountPath: /tls, readOnly: true }
            {{- end }}
      {{- if .Values.tls.enabled }}
      securityContext: { fsGroup: 999 }
      volumes:
        - name: tls
          secret: { secretName: edunexus-tls-redis, defaultMode: 0440 }
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.redis.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: edunexus-redis
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: edunexus-redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edunexus-rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: edunexus-rabbitmq }
  template:
    metadata:
      labels: { app: edunexus-rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.registry }}{{ .Values.rabbitmq.image }}"
          {{- if .Values.rabbitmq.auth.secretName }}
          # Replaces the stock guest account with this login (the image creates the default user from these two variables).
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.rabbitmq.auth.secretName }}, key: username } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ .Values.rabbitmq.auth.secretName }}, key: password } }
          {{- end }}
          {{- if .Values.tls.enabled }}
          ports: [{ containerPort: 5671 }, { containerPort: 15671 }]
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tlsconf, mountPath: /etc/rabbitmq/conf.d/10-tls.conf, subPath: 10-tls.conf, readOnly: true }
      securityContext: { fsGroup: 999 }
      volumes:
        - name: tls
          secret: { secretName: edunexus-tls-rabbitmq, defaultMode: 0440 }
        - name: tlsconf
          configMap: { name: edunexus-rabbitmq-tls }
          {{- else }}
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: edunexus-rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: edunexus-rabbitmq }
  {{- if .Values.tls.enabled }}
  ports: [{ port: 5671 }, { port: 15671 }]
  {{- else }}
  ports: [{ port: 5672 }, { port: 15672 }]
  {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edunexus-minio
  namespace: {{ .Values.namespace }}
spec:
  serviceName: edunexus-minio
  replicas: 1
  selector:
    matchLabels: { app: edunexus-minio }
  template:
    metadata:
      labels: { app: edunexus-minio }
    spec:
      containers:
        - name: minio
          image: "{{ .Values.registry }}{{ .Values.minio.image }}"
          {{- if .Values.tls.enabled }}
          args: [server, /data, --console-address, ":9001", --certs-dir, /certs]
          {{- else }}
          args: [server, /data, --console-address, ":9001"]
          {{- end }}
          env:
            - { name: MINIO_ROOT_USER, value: minio }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: edunexus-minio, key: root-password } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.tls.enabled }}
            - { name: tls, mountPath: /certs, readOnly: true }
            {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: edunexus-tls-minio
            # MinIO looks for public.crt and private.key (and CAs/ for trusted CAs) in its certs directory.
            items:
              - { key: tls.crt, path: public.crt }
              - { key: tls.key, path: private.key }
      {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.minio.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: edunexus-minio
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: edunexus-minio }
  ports: [{ port: 9000 }, { port: 9001 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edunexus-opensearch
  namespace: {{ .Values.namespace }}
spec:
  serviceName: edunexus-opensearch
  replicas: 1
  selector:
    matchLabels: { app: edunexus-opensearch }
  template:
    metadata:
      labels: { app: edunexus-opensearch }
    spec:
      containers:
        - name: opensearch
          image: "{{ .Values.registry }}{{ .Values.opensearch.image }}"
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
            {{- if .Values.tls.enabled }}
            # Reachable only through the TLS proxy below (same pod): the node itself listens on loopback.
            - { name: network.host, value: "127.0.0.1" }
            - { name: http.port, value: "9201" }
            {{- end }}
          {{- if not .Values.tls.enabled }}
          ports: [{ containerPort: 9200 }]
          {{- end }}
          volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
        {{- if .Values.tls.enabled }}
        - name: tls-proxy
          image: "{{ .Values.registry }}{{ .Values.tls.opensearchProxyImage }}"
          ports: [{ containerPort: 9200 }]
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: proxyconf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: edunexus-tls-opensearch, defaultMode: 0440 }
        - name: proxyconf
          configMap: { name: edunexus-opensearch-proxy }
        {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.opensearch.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: edunexus-opensearch
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: edunexus-opensearch }
  ports: [{ port: 9200 }]
