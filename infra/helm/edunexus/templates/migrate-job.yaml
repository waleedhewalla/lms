apiVersion: batch/v1
kind: Job
metadata:
  name: edunexus-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels: { app: edunexus-migrate }
    spec:
      restartPolicy: Never
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls-ca
          secret:
            secretName: edunexus-tls-api
            items: [{ key: ca.crt, path: ca.crt }]
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.registry }}{{ .Values.api.image }}"
          command: ["dotnet", "EduNexus.Api.dll", "--migrate-only"]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: {{ .Values.api.env.ASPNETCORE_ENVIRONMENT | quote }} }
            - name: EDUNEXUS_CONNECTION
              valueFrom: { secretKeyRef: { name: {{ .Values.api.secretName }}, key: connection } }
            {{- if .Values.tls.enabled }}
            - { name: Tls__CaFile, value: /etc/edunexus/tls/ca.crt }
          volumeMounts:
            - { name: tls-ca, mountPath: /etc/edunexus/tls, readOnly: true }
            {{- end }}
